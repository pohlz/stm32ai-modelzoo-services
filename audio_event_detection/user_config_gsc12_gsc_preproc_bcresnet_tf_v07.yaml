#    n_freq_mask: 2
#    n_time_mask: 2
#    mask_value: 0
#    enable: true   # result 97.21 bcresnet_tf_v05_2026_10_17_08_24_25
#    freq_mask_param: 4
#    time_mask_param: 10
#    n_freq_mask: 1
#    n_time_mask: 1
#    mask_value: 0
#    enable: true     # result 95.61 %  bcresnet_tf_v05_2026_10_18_00_57_07
#   freq_mask_param: 3
#   time_mask_param: 8
#   n_freq_mask: 1
#   n_time_mask: 1
#   mask_value: 0
#    enable: true        # result 93.73 bcresnet_tf_v05_2026_10_18_10_21_00
#    freq_mask_param: 5
#    time_mask_param: 13
#    n_freq_mask: 1
#    n_time_mask: 1
#    mask_value: 0
#    enable: true           # result 96.6 bcresnet_tf_v05_2026_10_19_06_41_11
#    freq_mask_param: 4
