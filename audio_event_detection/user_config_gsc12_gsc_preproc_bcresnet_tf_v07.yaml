#    freq_mask_param: 4
#    time_mask_param: 11
#    n_freq_mask: 1
#    n_time_mask: 1
#    mask_value: 0
#    enable: true           # result 89.02 bcresnet_tf_v05_2026_10_19_13_04_58
#    freq_mask_param: 4
#    time_mask_param: 9
#    n_freq_mask: 1
#    n_time_mask: 1
#    mask_value: 0
#    enable: true            # result 96.82  bcresnet_tf_v05_2026_10_19_21_42_36
#    freq_mask_param: 5
#    time_mask_param: 10
#    n_freq_mask: 1
#    n_time_mask: 1
#    mask_value: 0
#    enable: true               # result 95.38  bcresnet_tf_v05_2026_10_20_06_43_04
#    freq_mask_param: 3
#    time_mask_param: 10
#    n_freq_mask: 1
#    n_time_mask: 1
#    mask_value: 0
    enable: true              
    freq_mask_param: 4
    time_mask_param: 10
    n_freq_mask: 1
    n_time_mask: 1
    mask_value: 0


training:
  fine_tune: false
  dropout: 0.1 # Same rate 0.1 as PyTorch v03; Google's model default is 0.5.
  batch_size: 200
  epochs: 200
  resume_training: null
  optimizer:
    SGD:
      learning_rate: 0.02
      momentum: 0.9
      weight_decay: 0.001 # Keras decoupled weight decay, not PyTorch SGD's L2 penalty.
  callbacks:
    LRWarmupCosineDecay: # STM scheduler counts epochs, not batches.
      initial_lr: 0.01
      warmup_steps: 10
      max_lr: 0.05
      hold_steps: 0
      decay_steps: 190
      end_lr: 0.0

quantization:
  quantizer: TFlite_converter
  quantization_type: PTQ
  quantization_input_type: int8
  quantization_output_type: float
  granularity: per_channel
  export_dir: quantized_models

mlflow:
  uri: ./mlruns

hydra:
  job:
    chdir: false
  run:
    dir: ./tf/src/experiments_outputs/bcresnet_tf_v07_${now:%Y_%m_%d_%H_%M_%S}
