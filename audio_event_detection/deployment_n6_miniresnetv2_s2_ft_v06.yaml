general:
  project_name: myproject
  logs_dir: logs
  saved_models_dir: saved_models
  global_seed: 120
  display_figures: True  


operation_mode: deployment

model: 
  model_path: ./tf/src/experiments_outputs/miniresnetv2_s2_v06_2026_08_28_13_51_33/quantized_models/quantized_model.tflite

# Change this path to the model you wish to use
dataset:
  dataset_name: custom
  class_names: ['yes', 'no', 'up', 'down', 'left', 'right', 'on', 'off', 'stop', 'go', 'unknown', 'silence']
  file_extension: '.wav'

  multi_label: False 
  use_garbage_class: False 
  n_samples_per_garbage_class: 2
  expand_last_dim: True
  seed: 120 # Optional, there is a default seed
  to_cache: True
  shuffle: True

preprocessing:
  gsc_default: True
  target_rate: 16000
  sample_length: 1.0
  random_position: True
  time_shift_ms: 100
  background_noise_path: ../../datasets/speech_commands_v0.02/_background_noise_
  background_frequency: 0.8
  background_volume: 0.1
  # These WAVs are used only to generate validation/test silence and are
  # excluded from online training augmentation and training silence.
  reserved_background_files: ['running_tap.wav']

feature_extraction:
  patch_length: 50
  n_mels: 64
  n_fft: 1024
  hop_length: 320
  window_length: 1024
  window: hann
  center: true
  pad_mode: constant
  power: 2.0
  fmin: 20
  fmax: 7500
  norm: slaney
  htk: false
  to_db: true
  include_last_patch: false

tools:
  stedgeai:
    optimization: balanced
    on_cloud: False
    path_to_stedgeai: C:/ST/STEdgeAI/4.0/Utilities/windows/stedgeai.exe
  path_to_cubeIDE: C:/ST/STM32CubeIDE_2.2.0/STM32CubeIDE/stm32cubeide.exe

deployment:
  c_project_path:  ../application_code/audio/STM32N6
  IDE: GCC
  verbosity: 1
  hardware_setup:
    serie: STM32N6
    board: STM32N6570-DK
  build_conf : "BM" # this is default configuration
  # build_conf : "FREERTOS"
  # build_conf : "BM_LP"
  # build_conf : "FREERTOS_LP"
  unknown_class_threshold: 0.0 # Threshold used for OOD detection. Mutually exclusive with use_garbage_class
                               # Set to 0 to disable. To enable, set to any float between 0 and 1.

mlflow:
  uri: file:///home/xpohl/stm32ai-mlruns

hydra:
  run:
    dir: ./tf/src/experiments_outputs/${now:%Y_%m_%d_%H_%M_%S}