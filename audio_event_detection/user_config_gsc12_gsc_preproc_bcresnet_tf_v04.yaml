# Google kws_streaming BC-ResNet-1, STM training -> float evaluation -> PTQ -> int8 evaluation.
general:
  project_name: gsc12_bcresnet_tensorflow
  logs_dir: logs
  saved_models_dir: saved_models
  global_seed: 120
  gpu_memory_limit: 50
  display_figures: false # PNG reports are saved; do not open GUI windows on training servers.
  deterministic_ops: false

operation_mode: chain_tqe
#choices=['training' , 'evaluation', 'prediction', 'deployment', 'quantization', 'benchmarking',
#        'chain_tqeb','chain_tqe',' chain_eqe','chain_qb','chain_eqeb','chain_qd ']
model:
  model_name: custom
  input_shape: (40, 96, 1) # STM frequency,time,channel; internal transpose to Google layout
  pretrained: false
  model_path: null

dataset:
  dataset_name: custom
  class_names: ['yes', 'no', 'up', 'down', 'left', 'right', 'on', 'off', 'stop', 'go', 'unknown', 'silence']
  file_extension: '.wav'
  training_audio_path: ../../datasets/speech_commands_v0.02
  training_csv_path: ../../datasets/speech_commands_v0.02/training.csv
  validation_audio_path: ../../datasets/speech_commands_v0.02
  validation_csv_path: ../../datasets/speech_commands_v0.02/validation.csv
  quantization_audio_path: ../../datasets/speech_commands_v0.02
  quantization_csv_path: ../../datasets/speech_commands_v0.02/quantization.csv
  test_audio_path: null
  test_csv_path: null
  multi_label: false
  use_garbage_class: false
  n_samples_per_garbage_class: 2
  expand_last_dim: true
  seed: 120
  to_cache: true
  shuffle: true

preprocessing:
  gsc_default: true
  target_rate: 16000
  sample_length: 1.0
  random_position: true
  time_shift_ms: 100
  background_noise_path: ../../datasets/speech_commands_v0.02/_background_noise_
  background_frequency: 0.8
  background_volume: 0.1
  # These WAVs are used only to generate validation/test silence and are
  # excluded from online training augmentation and training silence.
  reserved_background_files: ['running_tap.wav']

feature_extraction:
  patch_length: 96
  n_mels: 40
  n_fft: 512
  hop_length: 160
  window_length: 480
  window: hann
  center: false
  pad_mode: constant
  power: 2.0
  fmin: 20
  fmax: 7500
  norm: null
  htk: true
  to_db: false
  include_last_patch: false

data_augmentation:
  GaussianNoise:
    enable: false
    scale: 0.1
  VolumeAugment:
    enable: false
    min_scale: 0.8
    max_scale: 1.2
  SpecAug:
    enable: true
    freq_mask_param: 1
    time_mask_param: 1
    n_freq_mask: 3
    n_time_mask: 4
    mask_value: 0

training:
  fine_tune: false
  dropout: 0.5 # Same rate as PyTorch v03; Google's model default is 0.5.
  batch_size: 100
  epochs: 200
  resume_training: null
  optimizer:
    SGD:
      learning_rate: 0.02
      momentum: 0.9
      weight_decay: 0.001 # Keras decoupled weight decay, not PyTorch SGD's L2 penalty.
  callbacks:
    LRWarmupCosineDecay: # STM scheduler counts epochs, not batches.
      initial_lr: 0.02
      warmup_steps: 5
      max_lr: 0.1
      hold_steps: 0
      decay_steps: 195
      end_lr: 0.0

quantization:
  quantizer: TFlite_converter
  quantization_type: PTQ
  quantization_input_type: int8
  quantization_output_type: float
  granularity: per_channel
  export_dir: quantized_models

mlflow:
  uri: ./mlruns

hydra:
  job:
    chdir: false
  run:
    dir: ./tf/src/experiments_outputs/bcresnet_tf_v04_${now:%Y_%m_%d_%H_%M_%S}
