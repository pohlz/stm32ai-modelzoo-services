# Native PyTorch counterpart of user_config_gsc12_gsc_preproc_bcresnet_ft_v03.yaml.
# Run from audio_event_detection with stm32ai_main_pt.py (see docs/README_BCRESNET_PT.md).
general:
  project_name: gsc12_bcresnet_pytorch
  saved_models_dir: saved_models
  global_seed: 120
  deterministic_ops: false
  device: auto

operation_mode: training # training or evaluation; no TFLite chain
model:
  framework: pytorch
  model_name: custom
  input_shape: [1, 40, 96] # C, frequency, time; batches are NCHW
  tau: 1 # upstream scales: 1, 1.5, 2, 3, 6, 8
  pretrained: false
  model_path: null # .pth checkpoint or upstream state_dict; never .h5/.keras

dataset:
  dataset_name: custom
  class_names: ['yes', 'no', 'up', 'down', 'left', 'right', 'on', 'off', 'stop', 'go', 'unknown', 'silence']
  file_extension: '.wav'
  training_audio_path: ../../datasets/speech_commands_v0.02
  training_csv_path: ../../datasets/speech_commands_v0.02/training.csv
  validation_audio_path: ../../datasets/speech_commands_v0.02
  validation_csv_path: ../../datasets/speech_commands_v0.02/validation.csv
  test_audio_path: null
  test_csv_path: null
  multi_label: false
  seed: 120
  shuffle: true

preprocessing:
  gsc_default: true
  target_rate: 16000
  sample_length: 1.0
  random_position: true
  time_shift_ms: 100
  background_noise_path: ../../datasets/speech_commands_v0.02/_background_noise_
  background_frequency: 0.8
  background_volume: 0.1
  reserved_background_files: ['running_tap.wav']

feature_extraction:
  patch_length: 96
  n_mels: 40
  n_fft: 512
  hop_length: 160
  window_length: 480
  window: hann
  center: false
  pad_mode: constant
  power: 2.0
  fmin: 20
  fmax: 7500
  norm: null
  htk: true
  to_db: false # natural log(mel + 1e-6)
  include_last_patch: false

training:
  fine_tune: false # set true with model.model_path for weight-only fine-tuning
  batch_size: 100
  epochs: 200
  warmup_epochs: 5
  num_workers: 0
  optimizer:
    SGD:
      learning_rate: 0.1
      momentum: 0.9
      weight_decay: 0.001
  # Upstream per-step warmup + cosine decay. Model retains Dropout2d(0.1).
  # No additional SpecAugment, matching upstream tau=1 and the v03 input config.

hydra:
  job:
    chdir: false
  run:
    dir: ./pt/src/experiments_outputs/bcresnet_py_v03_${now:%Y_%m_%d_%H_%M_%S}
