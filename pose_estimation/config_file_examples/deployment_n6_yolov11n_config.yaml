model:
   model_path: https://github.com/stm32-hotspot/ultralytics/raw/refs/heads/main/examples/YOLOv8-STEdgeAI/stedgeai_models/pose_estimation/yolo11/yolo11n_256_quant_pc_uf_pose_coco-st.tflite
   model_type: yolo_mpe

operation_mode: deployment

dataset:
   class_names: [person]
   keypoints: 17

preprocessing:
   resizing:
      aspect_ratio: crop
      interpolation: nearest
   color_mode: rgb

postprocessing:
   kpts_conf_thresh: 0.15
   confidence_thresh: 0.5
   max_detection_boxes: 10
   NMS_thresh: 0.5

tools:
   stedgeai:
      optimization: balanced
      on_cloud: False
      path_to_stedgeai: C:/ST/STEdgeAI/4.0/Utilities/windows/stedgeai.exe
   path_to_cubeIDE: C:/ST/STM32CubeIDE_1.17.0/STM32CubeIDE/stm32cubeide.exe

deployment:
   c_project_path: ../application_code/pose_estimation/STM32N6/
   IDE: GCC
   verbosity: 1
   hardware_setup:
      serie: STM32N6
      board: STM32N6570-DK

mlflow:
   uri: ./tf/src/experiments_outputs/mlruns

hydra:
   run:
      dir: ./tf/src/experiments_outputs/${now:%Y_%m_%d_%H_%M_%S}
